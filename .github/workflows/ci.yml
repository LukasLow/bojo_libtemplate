name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: repository shape
        run: |
          test -f __init__.mojo
          grep -q '^schema = 1$' bojo.pkg.toml
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # bojo installs the Mojo toolchain pinned in [version] on first use.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install bojo
        run: go install github.com/LukasLow/bojo/cmd/bojo@latest

      # A library has no bojo.toml of its own, so the job builds a throwaway
      # consumer that depends on this repository. That compiles the real
      # package, its `__init__.mojo` and everything it imports.
      - name: build a consumer
        run: |
          mod="gh.${GITHUB_REPOSITORY_OWNER}.$(echo "${GITHUB_REPOSITORY#*/}" | tr '-' '_')"
          mkdir -p .bojo/ci
          cat > .bojo/ci/bojo.toml <<TOML
          schema = 1
          [project]
          name    = "ci"
          version = "0.0.0"
          entry   = "main.mojo"
          [version]
          mojo = "1.1.0"
          [deps.local_lib]
          path = "../.."
          TOML
          printf 'import %s\n\ndef main():\n    pass\n' "$mod" > .bojo/ci/main.mojo
          cd .bojo/ci && bojo vendor && bojo build
